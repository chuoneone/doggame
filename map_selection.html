<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#140e08">
    <title>校園地圖 - 狗子冒險之旅</title>
    <link rel="icon" href="images/shiba.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>
    <div class="scene-bg" style="background-image:url('images/map.webp')"></div>

    <header class="hud">
        <img class="hud-avatar" id="hud-avatar" src="" alt="">
        <div class="hud-who">
            <strong id="hud-name"></strong>
            <span id="hud-ability"></span>
        </div>
        <div class="hud-spacer"></div>
        <span class="chip" title="肉乾"><span aria-hidden="true">🦴</span><span class="sr-only">肉乾</span><span class="gold" id="hud-jerky">0</span></span>
        <span class="chip stars-chip" title="星星"><span aria-hidden="true">⭐</span><span class="sr-only">星星</span><span class="gold" id="hud-stars">0</span></span>
        <div class="hud-actions">
            <a class="icon-btn" href="record.html" title="學習紀錄" aria-label="學習紀錄">📒</a>
            <button class="icon-btn" id="sound-btn" type="button"></button>
            <button class="icon-btn" id="menu-btn" type="button" title="選單" aria-label="選單">⚙️</button>
        </div>
    </header>

    <main class="map-main">
        <div class="quest-banner panel">
            <span class="quest-icon" id="quest-icon" aria-hidden="true">🧭</span>
            <div>
                <strong id="quest-title"></strong>
                <p id="quest-desc"></p>
            </div>
            <div class="progress-track">
                <small id="progress-text"></small>
                <div class="bar"><i id="progress-bar"></i></div>
            </div>
        </div>

        <div class="map-frame" id="map-frame">
            <img src="images/map.webp" alt="狗子學校校園地圖" width="1536" height="1024">
            <svg class="route" viewBox="0 0 150 100" aria-hidden="true" id="route"></svg>
        </div>

        <div class="stage-list" id="stage-list"></div>
    </main>

    <script src="js/core.js"></script>
    <script src="js/map_select.js"></script>
</body>

</html>
