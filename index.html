<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#140e08">
    <meta name="description" content="狗子冒險之旅：和狗狗夥伴一起解開校園數學謎題的冒險遊戲。">
    <title>狗子冒險之旅</title>
    <link rel="icon" href="images/shiba.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>
    <div class="scene-bg" style="background-image:url('images/intro.webp')"></div>

    <!-- 標題畫面 -->
    <section id="title-screen" class="screen active" aria-labelledby="game-title">
        <div class="title-badge">校園數學解謎冒險</div>
        <h1 id="game-title" class="game-title">狗子冒險之旅</h1>
        <p class="title-sub">陰影籠罩了學校，只有知識能把光帶回來。</p>
        <div class="title-actions">
            <button id="continue-btn" class="btn btn-primary btn-lg hidden">
                ▶ 繼續冒險 <span class="continue-info" id="continue-info"></span>
            </button>
            <button id="new-game-btn" class="btn btn-primary btn-lg">開始冒險</button>
        </div>
        <div class="title-foot">
            <a class="icon-btn" href="record.html" title="學習紀錄" aria-label="學習紀錄">📒</a>
            <button class="icon-btn" id="sound-btn" type="button"></button>
        </div>
    </section>

    <!-- 故事 -->
    <section id="story-screen" class="screen" aria-label="故事">
        <button class="btn btn-ghost btn-sm story-skip" id="skip-btn" type="button">跳過故事 ⏭</button>
        <div class="story-box panel">
            <p class="story-text" id="story-text" aria-live="polite"></p>
            <div class="story-foot">
                <div class="story-dots" id="story-dots"></div>
                <span class="story-next-hint">點一下或按空白鍵繼續 ▼</span>
            </div>
        </div>
    </section>

    <!-- 角色選擇 -->
    <section id="select-screen" class="screen" aria-labelledby="select-title">
        <div class="select-head">
            <h2 id="select-title">選擇你的冒險夥伴</h2>
            <p>每位夥伴都有獨特的能力，會在挑戰中幫上忙！</p>
        </div>
        <div class="char-grid" id="char-grid" role="radiogroup" aria-labelledby="select-title"></div>
        <div class="select-bar">
            <span class="picked" id="picked-text">尚未選擇夥伴</span>
            <button id="confirm-btn" class="btn btn-primary btn-lg" disabled>出發冒險 →</button>
        </div>
    </section>

    <script src="js/core.js"></script>
    <script src="js/intro.js"></script>
</body>

</html>
